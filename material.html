<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Материал — Разговоры о нужном</title><style>:root{--bg:#08090d;--panel:#11131a;--line:#292d3a;--accent:#8b5cf6;--muted:#9da2b0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#29204c 0,transparent 35%),var(--bg);color:#f4f5f7;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(1200px,calc(100% - 24px));margin:auto}.top{padding:18px 0;display:flex;gap:12px;align-items:center}.back{display:inline-flex;align-items:center;gap:9px;padding:10px 14px;border:1px solid #ffffff16;border-radius:13px;background:linear-gradient(135deg,#171923,#101219);color:#ddd2ff;text-decoration:none;font-weight:800;box-shadow:0 8px 24px #0004}.back:hover{border-color:#8b5cf655;transform:translateY(-1px)}.head{padding:18px 0 20px}.kicker{color:#9da2b0;font-size:13px}.head h1{font-size:clamp(28px,5vw,52px);line-height:1.05;margin:7px 0}.viewer{background:#0d0f15;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 24px 70px #0006}.viewer iframe{display:block;width:100%;height:min(78vh,820px);min-height:520px;border:0;background:#fff}.hint{padding:14px 17px;color:var(--muted);border-top:1px solid var(--line);font-size:13px}.error{padding:50px 25px;text-align:center}.error h2{margin-top:0}@media(max-width:600px){.viewer iframe{min-height:65vh;height:65vh}.wrap{width:min(1200px,calc(100% - 16px))}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="javascript:history.back()">← <span>Назад к уроку</span></a></div><div class="head"><div class="kicker">МАТЕРИАЛ</div><h1 id="title">Загрузка…</h1></div><div class="viewer" id="viewer"><iframe id="frame" title="Материал" allowfullscreen></iframe><div class="hint">Материал открыт внутри нового сайта. Кнопка назад возвращает к уроку.</div></div></div><script>const p=new URLSearchParams(location.search),src=p.get('source'),title=p.get('title')||'Материал';document.title=title+' — Разговоры о нужном';document.getElementById('title').textContent=title;if(src){document.getElementById('frame').src=src}else{document.getElementById('viewer').innerHTML='<div class="error"><h2>Материал не найден</h2><p>В ссылке отсутствует источник.</p></div>'}</script></body></html>
